<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- SPAWN app icon. Flat, one glyph colour, no gradients: a toad reduced to
       two eyes on a wide body with a cut-out smile. Source of truth for
       src-tauri/icons; run `npm run icons` after editing. -->
  <rect width="1024" height="1024" rx="232" fill="#0f1214"/>

  <g fill="#b6ff3b">
    <!-- body -->
    <rect x="212" y="452" width="600" height="332" rx="166"/>
    <!-- eyes -->
    <circle cx="368" cy="396" r="104"/>
    <circle cx="656" cy="396" r="104"/>
  </g>

  <!-- pupils and smile are cut from the glyph with the background colour -->
  <g fill="#0f1214">
    <circle cx="368" cy="396" r="40"/>
    <circle cx="656" cy="396" r="40"/>
  </g>
  <path d="M 330 610 Q 512 720 694 610" fill="none" stroke="#0f1214" stroke-width="34" stroke-linecap="round"/>
</svg>
